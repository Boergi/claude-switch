name: Desktop macOS

on:
  workflow_dispatch:
  push:
    branches: [desktop-ui]
    paths: ['desktop/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/desktop.yml']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run verify
      - run: npm run test:sync
      - run: npm run prepare:cli
      - run: npm run test:cli
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build
      - run: node scripts/verify-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: claude-switch-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
